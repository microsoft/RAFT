[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raft"
version = "0.1.0"
description = "Case trajectory extraction and embedding for RAFT"
requires-python = ">=3.11"
dependencies = [
    "bm25s>=0.3.11,<0.4",
    "numpy>=1.24,<3",
    "python-jsonpath>=2.2.1,<3",
    "pydantic>=2.12,<3",
    "tqdm>=4.67,<5",
    "openai-agents>=0.22.2,<0.23",
    "openai>=3,<4",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.25,<2"]
voyage = ["voyageai>=0.5,<0.6"]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "python-dotenv>=1.2,<2", "ruff>=0.12", "tiktoken>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
